# This is a common workflow synchronizing workflows in driver repositories.

name: Dev (Daily)

on:
  schedule:
    - cron: 14 23 * * *
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sync_workflows:
    name: Sync Workflows
    runs-on: ubuntu-slim

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Boop
        run: |
          git clone --depth 1 https://github.com/adbc-drivers/dev
          python adbc_drivers_dev/workflow.py generate $(pwd)

      - name: Bop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain; then
            git config user.name 'github-actions'
            git config user.email 'github-actions@github.com'

            BRANCH="chore/workflows_$(date +%Y-%m-%d)"
            git checkout -b $BRANCH

            git add .
            git commit -m "update generated workflows"
            git push origin $BRANCH

            gh pr create \
              --base main \
              --head $BRANCH \
              --title "chore: update generated workflows" \
              --body "TODO" \
              --dry-run
          else
            echo "No changes to commit. Skipping creating a PR."
          fi
